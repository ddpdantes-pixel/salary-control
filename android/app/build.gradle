apply plugin: 'com.android.application'

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def baseCode = appVersion.getProperty('versionCode', '')
def baseName = appVersion.getProperty('versionName', '')
if (!(baseCode ==~ /[1-9][0-9]*/) || baseCode.toLong() > 2100000000L || !(baseName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Invalid Android version.properties: use a positive versionCode and X.Y.Z versionName.')
}
def testCode = providers.gradleProperty('moyritmTestVersionCode').orNull
if (testCode != null && (!(testCode ==~ /[1-9][0-9]*/) || testCode.toLong() > 2100000000L || testCode.toLong() < baseCode.toLong())) {
    throw new GradleException('QA versionCode must be at least the configured release versionCode.')
}

def signingValues = [
    path: System.getenv('MOYRITM_KEYSTORE_PATH'),
    alias: System.getenv('MOYRITM_KEY_ALIAS'),
    storePassword: System.getenv('MOYRITM_STORE_PASSWORD'),
    keyPassword: System.getenv('MOYRITM_KEY_PASSWORD'),
]
def signingReady = signingValues.values().every { it != null && !it.isEmpty() }

def validateReleaseSigning = tasks.register('validateMoyRitmReleaseSigning') {
    doLast {
        if (!signingReady) {
            throw new GradleException('Release signing is not configured. Set MOYRITM_KEYSTORE_PATH, MOYRITM_KEY_ALIAS, MOYRITM_STORE_PASSWORD and MOYRITM_KEY_PASSWORD in this process only. See ANDROID_RELEASE_MIGRATION.md. No release APK is ready.')
        }
        def keyFile = file(signingValues.path)
        if (!keyFile.isFile()) {
            throw new GradleException('The release keystore file does not exist.')
        }
        def realKeyPath = keyFile.toPath().toRealPath()
        def repositoryPath = rootProject.projectDir.parentFile.toPath().toRealPath()
        if (!new File(signingValues.path).isAbsolute() || realKeyPath.startsWith(repositoryPath)) {
            throw new GradleException('The release keystore must be outside the repository; use an absolute path.')
        }
        if (keyFile.name.equalsIgnoreCase('debug.keystore')) {
            throw new GradleException('The Android debug keystore must not sign a permanent release.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'validateSigningRelease') {
        dependsOn(validateReleaseSigning)
    }
}

android {
    namespace = "io.github.ddpdantespixel.moyritm"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.ddpdantespixel.moyritm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (testCode ?: baseCode).toInteger()
        versionName = testCode == null ? baseName : "${baseName}-qa.${testCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
